# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish ONLY the runtime subset — the whole-repo upload used to expose /tests/*.mjs
      # and /scripts/*.mjs on Pages. Copy just what the app loads at runtime into dist/:
      # index.html, app.js, vendor/, data/ (minus staging/ scratch and *.bak backups, but
      # including data/logos/ that the logo rail fetches and the data/*.json.js fallbacks).
      - name: Prepare runtime subset
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist dist/data
          cp index.html app.js dist/
          cp -r vendor dist/vendor
          rsync -a --exclude 'staging/' --exclude '*.bak' data/ dist/data/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload the prepared runtime subset, never the whole repository
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
